name: CI

on:
  push:
    branches: [main]
    paths:
      - "lab*/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      labs: ${{ steps.find.outputs.labs }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        name: Find lab folders
        run: |
          LABS=$(ls -d lab*/ 2>/dev/null | sed 's|/$||' | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "Found labs: $LABS"
          echo "labs=$LABS" >> $GITHUB_OUTPUT

  test:
    needs: setup
    if: needs.setup.outputs.labs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJSON(needs.setup.outputs.labs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: ${{ matrix.lab }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: ${{ matrix.lab }}
        run: ruff check .
      - name: Type check (mypy)
        working-directory: ${{ matrix.lab }}
        run: mypy src
      - name: Tests with coverage
        working-directory: ${{ matrix.lab }}
        run: pytest

  build:
    needs: [setup, test]
    if: |
      github.ref == 'refs/heads/main' &&
      needs.setup.outputs.labs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJSON(needs.setup.outputs.labs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build wheel
        working-directory: ${{ matrix.lab }}
        run: python -m build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lab }}-dist
          path: ${{ matrix.lab }}/dist/*

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          files: artifacts/**/*
